<!--/*
    Reusable assignment list fragment.

    Generischer Baustein, um "items" (Fragebögen, Kliniken, Benutzer, ...)
    einem Elternobjekt (Bundle, Klinik, Einladung, ...) zuzuweisen.

*/-->
<th:block th:fragment="assignmentList(assignedItems, availableItems, fieldPrefix, itemDtoField, isModifiable,
                                      headingText, headingInfoText, addButtonText, emptyStateText,
                                      reorderText, alreadyAddedText, disableWhenEmptySelector,
                                      itemMetaFragment, assignedDetailFragment, availableDetailFragment)">
  <div id="assignmentList"
       th:attr="data-field-prefix=${fieldPrefix},
                data-disable-when-empty=${disableWhenEmptySelector},
                data-already-added-text=${alreadyAddedText ?: 'Already added'}">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div>
        <h3 class="h5 mb-0" th:text="${headingText ?: 'Assigned items'}">Assigned items</h3>
        <small class="text-muted" th:text="${headingInfoText}"></small>
      </div>
      <button type="button"
              class="btn btn-primary"
              id="openItemSelectionButton"
              data-bs-toggle="modal"
              data-bs-target="#itemSelectionModal"
              th:disabled="${#bools.isFalse(isModifiable)}">
        <span class="bi bi-plus-lg" aria-hidden="true"></span>
        <span th:text="${addButtonText ?: 'Add items'}">Add items</span>
      </button>
    </div>

    <div id="assignedItemEmptyState"
         class="alert alert-light border"
         th:style="${#lists.isEmpty(assignedItems)} ? '' : 'display:none;'"
         th:text="${emptyStateText ?: 'No items assigned'}">
      No items assigned
    </div>

    <div id="assignedItemList" class="list-group">
      <div class="list-group-item assignment-list-item"
           th:each="assignment, status : ${assignedItems}"
           th:with="itemDto=${assignment.__${itemDtoField}__}"
           th:attr="data-item-id=${itemDto.id}">
        <div class="row align-items-start g-2">
          <div class="col-auto pt-2">
            <button type="button"
                    class="btn btn-sm btn-link text-body assignment-drag-handle"
                    th:disabled="${#bools.isFalse(isModifiable)}"
                    th:title="${reorderText ?: 'Change order'}">
              <span class="bi bi-grip-vertical" aria-hidden="true"></span>
            </button>
          </div>

          <div class="col-auto pt-2 assignment-item-position">
            <span th:text="|${status.index + 1}.|">1.</span>
            <input type="hidden"
                   data-field="position"
                   th:name="|${fieldPrefix}[${status.index}].position|"
                   th:value="${status.index + 1}" />
          </div>

          <div class="col">
            <div class="fw-semibold" th:text="${itemDto.name}">Item</div>
            <th:block th:if="${itemMetaFragment != null}">
              <th:block th:replace="~{__${itemMetaFragment}__ (itemDto=${itemDto})}"></th:block>
            </th:block>

            <input type="hidden"
                   th:attr="data-field=${itemDtoField + '.name'}"
                   th:name="|${fieldPrefix}[${status.index}].${itemDtoField}.name|"
                   th:value="${itemDto.name}" />
            <input type="hidden"
                   th:attr="data-field=${itemDtoField + '.id'}"
                   th:name="|${fieldPrefix}[${status.index}].${itemDtoField}.id|"
                   th:value="${itemDto.id}" />
          </div>

          <th:block th:if="${assignedDetailFragment != null}">
            <th:block th:replace="~{__${assignedDetailFragment}__ (assignment=${assignment},
                                     itemDto=${itemDto},
                                     index=${status.index},
                                     fieldPrefix=${fieldPrefix},
                                     isModifiable=${isModifiable})}"></th:block>
          </th:block>

          <div class="col-auto pt-1">
            <button type="button"
                    class="btn btn-sm btn-outline-danger remove-assignment-item-button"
                    th:disabled="${#bools.isFalse(isModifiable)}"
                    th:title="${messages.get(#locale, 'button.remove', 'Remove')}">
              <span class="bi bi-trash" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="itemSelectionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" th:text="${addButtonText ?: 'Add items'}">
            Add items
          </h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <input id="itemSelectionFilter"
                 class="form-control mb-3"
                 type="search"
                 th:placeholder="${messages.get(#locale, 'filter.label.placeholder', 'Search for...')}" />

          <div id="itemSelectionEmptyState"
               class="alert alert-light border"
               style="display:none;"
               th:text="${messages.get(#locale, 'filter.label.noHits', 'Search didn''t match any results')}">
            No matches
          </div>

          <div id="itemSelectionList" class="list-group">
            <!-- Bereits zugewiesene Items werden angezeigt, aber deaktiviert. -->
            <div class="list-group-item assignment-selection-row"
                 th:each="assignment : ${assignedItems}"
                 th:with="itemDto=${assignment.__${itemDtoField}__}"
                 th:attr="data-item-id=${itemDto.id},data-search-name=${#strings.toLowerCase(itemDto.name)}">
              <div class="form-check">
                <input class="form-check-input assignment-selection-checkbox"
                       type="checkbox"
                       disabled="disabled"
                       th:id="|select_item_${itemDto.id}|" />
                <label class="form-check-label w-100"
                       th:for="|select_item_${itemDto.id}|">
                  <span th:text="${itemDto.name}">Item</span>
                  <span class="badge bg-secondary float-end assignment-item-assigned-badge"
                        th:text="${alreadyAddedText ?: 'Already added'}">
                    Already added
                  </span>
                </label>
              </div>

              <div class="assignment-item-template d-none">
                <div th:replace="~{fragments/assignmentList :: assignmentItemTemplate(
                        itemDto=${itemDto},
                        itemDtoField=${itemDtoField},
                        reorderText=${reorderText},
                        itemMetaFragment=${itemMetaFragment},
                        availableDetailFragment=${availableDetailFragment})}"></div>
              </div>
            </div>

            <div class="list-group-item assignment-selection-row"
                 th:each="itemDto : ${availableItems}"
                 th:attr="data-item-id=${itemDto.id},data-search-name=${#strings.toLowerCase(itemDto.name)}">
              <div class="form-check">
                <input class="form-check-input assignment-selection-checkbox"
                       type="checkbox"
                       th:id="|select_item_${itemDto.id}|" />
                <label class="form-check-label w-100"
                       th:for="|select_item_${itemDto.id}|">
                  <span th:text="${itemDto.name}">Item</span>
                  <th:block th:if="${itemMetaFragment != null}">
                    <th:block th:replace="~{__${itemMetaFragment}__ (itemDto=${itemDto})}"></th:block>
                  </th:block>
                </label>
              </div>

              <div class="assignment-item-template d-none">
                <div th:replace="~{fragments/assignmentList :: assignmentItemTemplate(
                        itemDto=${itemDto},
                        itemDtoField=${itemDtoField},
                        reorderText=${reorderText},
                        itemMetaFragment=${itemMetaFragment},
                        availableDetailFragment=${availableDetailFragment})}"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                  th:text="${messages.get(#locale, 'button.cancel', 'Cancel')}">Cancel</button>
          <button type="button" class="btn btn-primary" id="addSelectedItemsButton" disabled="disabled">
            <span th:text="${messages.get(#locale, 'button.addSelection', 'Add selected')}">Add selected</span>
            <span id="selectedItemCount">(0)</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</th:block>

<!-- Template, das beim Hinzufuegen eines verfuegbaren Items in die Liste geklont wird. -->
<div th:fragment="assignmentItemTemplate(itemDto, itemDtoField, reorderText, itemMetaFragment, availableDetailFragment)"
     class="list-group-item assignment-list-item"
     th:attr="data-item-id=${itemDto.id}">
  <div class="row align-items-start g-2">
    <div class="col-auto pt-2">
      <button type="button" class="btn btn-sm btn-link text-body assignment-drag-handle"
              th:title="${reorderText ?: 'Change order'}">
        <span class="bi bi-grip-vertical" aria-hidden="true"></span>
      </button>
    </div>
    <div class="col-auto pt-2 assignment-item-position">
      <span>0.</span>
      <input type="hidden" data-field="position" value="0" disabled="disabled" />
    </div>
    <div class="col">
      <div class="fw-semibold" th:text="${itemDto.name}">Item</div>
      <th:block th:if="${itemMetaFragment != null}">
        <th:block th:replace="~{__${itemMetaFragment}__ (itemDto=${itemDto})}"></th:block>
      </th:block>
      <input type="hidden" th:attr="data-field=${itemDtoField + '.name'}" th:value="${itemDto.name}" disabled="disabled" />
      <input type="hidden" th:attr="data-field=${itemDtoField + '.id'}" th:value="${itemDto.id}" disabled="disabled" />
    </div>

    <th:block th:if="${availableDetailFragment != null}">
      <th:block th:replace="~{__${availableDetailFragment}__ (itemDto=${itemDto})}"></th:block>
    </th:block>

    <div class="col-auto pt-1">
      <button type="button" class="btn btn-sm btn-outline-danger remove-assignment-item-button"
              th:title="${messages.get(#locale, 'button.remove', 'Remove')}">
        <span class="bi bi-trash" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</div>
