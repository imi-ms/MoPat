<!-- Reusable questionnaire assignment fragment for bundle editing. -->
<th:block th:fragment="questionnaireAssignment(assignedQuestionnaires, availableQuestionnaires, fieldPrefix, isModifiable)">
  <div id="questionnaireAssignment" th:attr="data-field-prefix=${fieldPrefix}">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div>
        <h3 class="h5 mb-0"
            th:text="${messages.get(#locale, 'bundle.heading.assignedQuestionnaires', 'Assigned questionnaires')}">
          Assigned questionnaires
        </h3>
        <small class="text-muted"
               th:text="${messages.get(#locale, 'bundle.heading.assignedQuestionnaireInfo', 'Configure and reorder the questionnaires in this bundle.')}">
          Configure and reorder the questionnaires in this bundle.
        </small>
      </div>
      <button type="button"
              class="btn btn-primary"
              id="openQuestionnaireSelectionButton"
              data-bs-toggle="modal"
              data-bs-target="#questionnaireSelectionModal"
              th:disabled="${#bools.isFalse(isModifiable)}">
        <span class="bi bi-plus-lg" aria-hidden="true"></span>
        <span th:text="${messages.get(#locale, 'questionnaire.button.add', 'Add questionnaires')}">
                    Add questionnaires
                </span>
      </button>
    </div>

    <div id="assignedQuestionnaireEmptyState"
         class="alert alert-light border"
         th:style="${#lists.isEmpty(assignedQuestionnaires)} ? '' : 'display:none;'"
         th:text="${messages.get(#locale, 'bundle.table.bundleQuestionnairesEmpty', 'No questionnaires assigned')}">
      No questionnaires assigned
    </div>

    <div id="assignedQuestionnaireList" class="list-group">
      <div class="list-group-item questionnaire-assignment-item"
           th:each="bundleQuestionnaireDTO, status : ${assignedQuestionnaires}"
           th:attr="data-questionnaire-id=${bundleQuestionnaireDTO.questionnaireDTO.id},data-version-group-id=${bundleQuestionnaireDTO.questionnaireDTO.questionnaireVersionGroupId}">
        <div class="row align-items-start g-2">
          <div class="col-auto pt-2">
            <button type="button"
                    class="btn btn-sm btn-link text-body questionnaire-drag-handle"
                    th:disabled="${#bools.isFalse(isModifiable)}"
                    th:title="${messages.get(#locale, 'bundle.button.reorderQuestionnaire', 'Change order')}">
              <span class="bi bi-grip-vertical" aria-hidden="true"></span>
            </button>
          </div>

          <div class="col-auto pt-2 questionnaire-position">
            <span th:text="|${status.index + 1}.|">1.</span>
            <input type="hidden"
                   data-field="position"
                   th:name="|${fieldPrefix}[${status.index}].position|"
                   th:value="${status.index + 1}" />
          </div>

          <div class="col">
            <div class="fw-semibold" th:text="${bundleQuestionnaireDTO.questionnaireDTO.name}">Questionnaire</div>
            <small class="text-muted"
                   th:if="${bundleQuestionnaireDTO.questionnaireDTO.version > 0}"
                   th:text="|Version ${bundleQuestionnaireDTO.questionnaireDTO.version}|">Version 1</small>

            <input type="hidden"
                   data-field="questionnaireDTO.name"
                   th:name="|${fieldPrefix}[${status.index}].questionnaireDTO.name|"
                   th:value="${bundleQuestionnaireDTO.questionnaireDTO.name}" />
            <input type="hidden"
                   data-field="questionnaireDTO.id"
                   th:name="|${fieldPrefix}[${status.index}].questionnaireDTO.id|"
                   th:value="${bundleQuestionnaireDTO.questionnaireDTO.id}" />
          </div>

          <div class="col-md-2" th:if="${bundleQuestionnaireDTO.questionnaireDTO.hasScores}">
            <div class="form-check mt-2">
              <input class="form-check-input"
                     type="checkbox"
                     data-field="showScores"
                     th:name="|${fieldPrefix}[${status.index}].showScores|"
                     th:checked="${bundleQuestionnaireDTO.showScores}"
                     th:disabled="${#bools.isFalse(isModifiable)}" />
              <label class="form-check-label"
                     th:text="${messages.get(#locale, 'bundle.table.score', 'Score')}">Score</label>
            </div>
          </div>

          <div class="col-md-4">
            <div class="small fw-semibold mb-1"
                 th:text="${messages.get(#locale, 'bundle.table.export', 'Export')}">Export</div>
            <div class="form-check"
                 th:each="exportTemplate, templateStatus : ${bundleQuestionnaireDTO.questionnaireDTO.exportTemplates}">
              <input type="hidden"
                     th:attr="data-field=|questionnaireDTO.exportTemplate[${templateStatus.index}].id|"
                     th:name="|${fieldPrefix}[${status.index}].questionnaireDTO.exportTemplate[${templateStatus.index}].id|"
                     th:value="${exportTemplate.id}" />
              <input class="form-check-input"
                     type="checkbox"
                     data-field="exportTemplates"
                     th:name="|${fieldPrefix}[${status.index}].exportTemplates|"
                     th:value="${exportTemplate.id}"
                     th:checked="${bundleQuestionnaireDTO.exportTemplates.contains(exportTemplate.id)}"
                     th:disabled="${#bools.isFalse(isModifiable)}" />
              <label class="form-check-label"
                     th:text="|(${exportTemplate.exportTemplateType}:${exportTemplate.configurationGroup.name}) ${exportTemplate.name}|">
                Export template
              </label>
            </div>
            <span class="text-muted small"
                  th:if="${#sets.isEmpty(bundleQuestionnaireDTO.questionnaireDTO.exportTemplates)}">–</span>
          </div>

          <div class="col-md-2">
            <div class="form-check mt-2">
              <input class="form-check-input"
                     type="checkbox"
                     data-field="isEnabled"
                     th:name="|${fieldPrefix}[${status.index}].isEnabled|"
                     th:checked="${bundleQuestionnaireDTO.isEnabled}"
                     th:disabled="${#bools.isFalse(isModifiable)}" />
              <label class="form-check-label"
                     th:text="${messages.get(#locale, 'bundle.table.isEnabled', 'Enabled')}">Enabled</label>
            </div>
          </div>

          <div class="col-auto pt-1">
            <button type="button"
                    class="btn btn-sm btn-outline-danger remove-questionnaire-button"
                    th:disabled="${#bools.isFalse(isModifiable)}"
                    th:title="${messages.get(#locale, 'button.remove', 'Remove')}">
              <span class="bi bi-trash" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="questionnaireSelectionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5"
              th:text="${messages.get(#locale, 'questionnaire.button.add', 'Add questionnaires')}"> <!-- Translation key is for buttons, but this is the correct one here -->
            Add questionnaires
          </h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <input id="questionnaireSelectionFilter"
                 class="form-control mb-3"
                 type="search"
                 th:placeholder="${messages.get(#locale, 'filter.label.placeholder', 'Search for...')}" />

          <div id="questionnaireSelectionEmptyState"
               class="alert alert-light border"
               style="display:none;"
               th:text="${messages.get(#locale, 'filter.label.noHits', 'Search didn''t match any results')}">
            No matches
          </div>

          <div id="questionnaireSelectionList" class="list-group">
            <!-- Initially assigned questionnaires are shown but disabled. -->
            <div class="list-group-item questionnaire-selection-row"
                 th:each="bundleQuestionnaireDTO : ${assignedQuestionnaires}"
                 th:attr="data-questionnaire-id=${bundleQuestionnaireDTO.questionnaireDTO.id},data-search-name=${#strings.toLowerCase(bundleQuestionnaireDTO.questionnaireDTO.name)}">
              <div class="form-check">
                <input class="form-check-input questionnaire-selection-checkbox"
                       type="checkbox"
                       disabled="disabled"
                       th:id="|select_questionnaire_${bundleQuestionnaireDTO.questionnaireDTO.id}|" />
                <label class="form-check-label w-100"
                       th:for="|select_questionnaire_${bundleQuestionnaireDTO.questionnaireDTO.id}|">
                  <span th:text="${bundleQuestionnaireDTO.questionnaireDTO.name}">Questionnaire</span>
                  <span class="badge bg-secondary float-end"
                        th:text="${messages.get(#locale, 'questionnaire.label.alreadyAdded', 'Already added')}">
                                        Already added
                                    </span>
                </label>
              </div>

              <div class="questionnaire-assignment-template d-none">
                <div th:replace="~{fragments/questionnaireAssignment :: availableQuestionnaireItemTemplate(questionnaire=${bundleQuestionnaireDTO.questionnaireDTO})}"></div>
              </div>
            </div>

            <div class="list-group-item questionnaire-selection-row"
                 th:each="questionnaire : ${availableQuestionnaires}"
                 th:attr="data-questionnaire-id=${questionnaire.id},data-search-name=${#strings.toLowerCase(questionnaire.name)}">
              <div class="form-check">
                <input class="form-check-input questionnaire-selection-checkbox"
                       type="checkbox"
                       th:id="|select_questionnaire_${questionnaire.id}|" />
                <label class="form-check-label w-100"
                       th:for="|select_questionnaire_${questionnaire.id}|">
                  <span th:text="${questionnaire.name}">Questionnaire</span>
                  <small class="text-muted ms-2"
                         th:if="${questionnaire.version > 0}"
                         th:text="|Version ${questionnaire.version}|">Version 1</small>
                </label>
              </div>

              <div class="questionnaire-assignment-template d-none">
                <div th:replace="~{fragments/questionnaireAssignment :: availableQuestionnaireItemTemplate(questionnaire=${questionnaire})}"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                  th:text="${messages.get(#locale, 'button.cancel', 'Cancel')}">Cancel</button>
          <button type="button" class="btn btn-primary" id="addSelectedQuestionnairesButton" disabled="disabled">
            <span th:text="${messages.get(#locale, 'button.addSelection', 'Add selected')}">Add selected</span>
            <span id="selectedQuestionnaireCount">(0)</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</th:block>

<!-- Template used when an available questionnaire is added to the assigned list. -->
<div th:fragment="availableQuestionnaireItemTemplate(questionnaire)"
     class="list-group-item questionnaire-assignment-item"
     th:attr="data-questionnaire-id=${questionnaire.id},data-version-group-id=${questionnaire.questionnaireVersionGroupId}">
  <div class="row align-items-start g-2">
    <div class="col-auto pt-2">
      <button type="button" class="btn btn-sm btn-link text-body questionnaire-drag-handle"
              th:title="${messages.get(#locale, 'bundle.button.reorderQuestionnaire', 'Change order')}">
        <span class="bi bi-grip-vertical" aria-hidden="true"></span>
      </button>
    </div>
    <div class="col-auto pt-2 questionnaire-position">
      <span>0.</span>
      <input type="hidden" data-field="position" value="0" disabled="disabled" />
    </div>
    <div class="col">
      <div class="fw-semibold" th:text="${questionnaire.name}">Questionnaire</div>
      <small class="text-muted" th:if="${questionnaire.version > 0}"
             th:text="|Version ${questionnaire.version}|">Version 1</small>
      <input type="hidden" data-field="questionnaireDTO.name" th:value="${questionnaire.name}" disabled="disabled" />
      <input type="hidden" data-field="questionnaireDTO.id" th:value="${questionnaire.id}" disabled="disabled" />
    </div>
    <div class="col-md-2" th:if="${questionnaire.hasScores}">
      <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" data-field="showScores" disabled="disabled" />
        <label class="form-check-label"
               th:text="${messages.get(#locale, 'bundle.table.score', 'Score')}">Score</label>
      </div>
    </div>
    <div class="col-md-4">
      <div class="small fw-semibold mb-1"
           th:text="${messages.get(#locale, 'bundle.table.export', 'Export')}">Export</div>
      <div class="form-check" th:each="exportTemplate, templateStatus : ${questionnaire.exportTemplates}">
        <input type="hidden"
               th:attr="data-field=|questionnaireDTO.exportTemplate[${templateStatus.index}].id|"
               th:value="${exportTemplate.id}"
               disabled="disabled" />
        <input class="form-check-input"
               type="checkbox"
               data-field="exportTemplates"
               th:value="${exportTemplate.id}"
               disabled="disabled" />
        <label class="form-check-label"
               th:text="|(${exportTemplate.exportTemplateType}:${exportTemplate.configurationGroup.name}) ${exportTemplate.name}|">
          Export template
        </label>
      </div>
      <span class="text-muted small" th:if="${#sets.isEmpty(questionnaire.exportTemplates)}">–</span>
    </div>
    <div class="col-md-2">
      <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" data-field="isEnabled" checked="checked" disabled="disabled" />
        <label class="form-check-label"
               th:text="${messages.get(#locale, 'bundle.table.isEnabled', 'Enabled')}">Enabled</label>
      </div>
    </div>
    <div class="col-auto pt-1">
      <button type="button" class="btn btn-sm btn-outline-danger remove-questionnaire-button"
              th:title="${messages.get(#locale, 'button.remove', 'Remove')}">
        <span class="bi bi-trash" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</div>
