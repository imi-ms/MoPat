<div
        id="previewModal"
        class="modal fade"
>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">
                <div
                        id="questionTitle"
                        class="itemRow questionTitle resizable w-100 border-bottom"
                ></div>
                <div
                        id="questionContent"
                        class="itemRow questionContent"
                >
                </div>
            </div>
        </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
</div>

<th:block
        layout:insert="~{fragments/surveyMessages :: surveyMessages}"
></th:block>

<script th:src="@{/js/mobile/helper/survey/questionStyleEnhancer.js?version=3.3.0}"></script>
<script defer th:src="@{/js/mobile/survey/model/question.js?version=3.3.0}"></script>

<th:block layout:fragment="scriptContainer">
    <script
            th:inline="javascript"
            type="text/javascript"
    >
        var language = [[${#locale.toString}]];

        $('#previewModal').on('show.bs.modal', function (event) {
            let form = document.getElementsByName("questionDTO")[0];
            const formData = new FormData(form);

            fetch("/question/previewDTO", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(updatedDTO => {
                var question = new Question();
                $.extend(question, updatedDTO);
                question.init();
                var content = $('#questionContent');
                updateQuestionTitles(updatedDTO);
                question.getHTML(content, true, language);
            });
        });

        $('#previewModal').on('hide.bs.modal', function (event) {
            $('#questionContent').empty();
            $('#questionTitle').empty();
        });

        function updateQuestionTitles(question) {
            //Add title to the question title div
            $("#questionTitle").append($("<span/>", {
                "id": "questionTitleText",
                "html": question.localizedQuestionText[language],
            }));

            //Add padding only to the question content for the scrolling question title
            var scrollQuestionTitlePaddingDiv = $("<div/>", {
                "class": "px-5",
            });

            //Add the actual question title to the padded div
            scrollQuestionTitlePaddingDiv.append($("<span/>", {
                "html": question.localizedQuestionText[language],
            }));

            //Merge everything to the scrolling question title div
            $("#scrollQuestionTitle").append(scrollQuestionTitlePaddingDiv);

            //Add a collapse button to the scrolling question title
            var hideMenuDiv = $("<div/>", {
                "class": "w-100 border",
            });

            var hideMenuButton = $("<button/>", {
                "class": "btn-lowEmphasis w-100",
                "onclick": "manuallyCloseScrollTitle()"
            });

            var hideMenuBi = $("<i/>", {
                "class": "bi bi-chevron-compact-up"
            });

            hideMenuButton.append(hideMenuBi);
            hideMenuDiv.append(hideMenuButton);
            $("#scrollQuestionTitle").append(hideMenuDiv);
        }

    </script>
</th:block>
