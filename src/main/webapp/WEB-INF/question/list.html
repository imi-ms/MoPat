<!--/*
    * View that show all available questions    
*/-->
<th:block
    layout:decorate="~{layout/main}"
    th:with="title=${messages.get(#locale, 'question.heading.title', 'Questions')} +
            '&nbsp;' + '&ldquo;' +
            ${questionnaire.name} + '&rdquo;'"
>
    <th:block layout:fragment="content">
        <div class="panel-body mb-3">
            <a
                class="link"
                th:href="@{/questionnaire/list}"
            >
                <i class="bi bi-arrow-left"></i>
                <th:block
                    th:text="${messages.get(#locale, 'question.button.toQuestionnaireList', 'To list of questionnaires')}"
                />
            </a>
        </div>
        <div class="panel-body">
            <div
                class="alert"
                id="notification"
            ></div>
            <th:block th:if="not ${#strings.isEmpty(errorMessages)}">
                <div
                    class="alert alert-danger"
                    id="errors"
                >
                    <th:block th:each="errorMessage: ${errorMessages}">
                        <th:block th:text="${errorMessage}" /><br />
                    </th:block>
                </div>
            </th:block>
            <th:block th:if="not ${#strings.isEmpty(errorQuestions)}">
                <div
                    class="alert alert-danger"
                    id="errorQuestions"
                >
                    <th:block th:text="#{question.error.isConditionTarget}" /><br />
                    <th:block th:each="errorQuestion: ${errorQuestions}">
                        <th:block th:text="|${errorQuestion.position}.|" />
                        <th:block
                            layout:insert="~{helper/var :: add(key='groupedLocalizedTextByCountries', 
                                                    value=${localizedQuestionTextsForQuestion[errorQuestion.id]})}"
                        />
                        <a
                            class="link"
                            th:href="@{condition/listQuestionConditions?questionId=__${errorQuestion.id}__}"
                        >
                            <th:block
                                layout:insert="~{helper/localeHelper/showLocalizedTextGroupedByCountry}"
                            ></th:block>
                        </a>
                        <br />
                    </th:block>
                </div>
            </th:block>
        </div>

        <div class="card glassy d-flex flex-row shadow-sm mb-3">
            <a
                class="btn btn-primary"
                id="editDescription"
                th:href="@{/questionnaire/fill?id=__${questionnaire.id}__}"
            >
                <i class="bi bi-cursor-text"></i>
                <th:block
                    th:text="${messages.get(#locale, 'question.button.editDescription', 'Edit description')}"
                />
            </a>
            <a
                class="btn btn-primary"
                id="manageExports"
                th:href="@{/mapping/list?id=__${questionnaire.id}__}"
            >
                <i class="bi bi-share-fill"></i>
                <th:block
                    th:text="${messages.get(#locale, 'question.button.manageExports', 'Manage exports')}"
                />
            </a>
            <a
                class="btn btn-primary"
                id="manageScores"
                th:href="@{/score/list?id=__${questionnaire.id}__}"
            >
                <i class="bi bi-calculator"></i>
                <th:block
                    th:text="${messages.get(#locale, 'question.button.manageScores', 'Manage scores')}"
                />
            </a>

            <button
                type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#bundleModal"
            >
                <i class="bi bi-collection"></i>
                <th:block
                    th:text="${messages.get(#locale, 'question.button.addToBundle', 'Add to bundle')}"
                ></th:block>
            </button>
        </div>

        <div class="card glassy shadow-sm mt-3">
            <div class="table-responsive">
                <table
                    class="sortable table table-hover responsive"
                    id="questionTable"
                    style="width: 100%"
                >
                    <thead class="sticky-top">
                        <tr>
                            <th colspan="7">
                                <h5
                                    th:text="${messages.get(#locale, 'question.label.overview', 'Question Overview')}"
                                ></h5>
                            </th>
                        </tr>
                        <tr>
                            <th colspan="7">
                                <div class="d-flex">
                                    <div class="panel-body me-2">
                                        <form
                                            action="fill"
                                            method="POST"
                                            th:object="${question}"
                                        >
                                            <input
                                                id="questionnaireId"
                                                name="questionnaireId"
                                                th:value="${questionnaire.id}"
                                                type="hidden"
                                            />
                                            <button
                                                class="btn btn-primary"
                                                id="addQuestion"
                                                type="submit"
                                            >
                                                <i class="bi bi-plus-lg"></i>
                                                <th:block
                                                    th:text="${messages.get(#locale, 'question.button.addQuestion', 'Add question')}"
                                                />
                                            </button>
                                        </form>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <a
                                            class="dropdown dropdown-toggle link btn btn-primary"
                                            data-bs-toggle="dropdown"
                                            data-bs-target="#languageSelector"
                                            th:text="${messages.get(#locale, 'question.label.selectLanguage', 'Select question language')}"
                                        ></a>
                                        <ul class="dropdown-menu">
                                            <th:block th:each="language: ${languages}">
                                                <th:block
                                                    th:with="
                                                    splitLang=${#strings.listSplit(language, '_')},
                                                    baseLang=${splitLang[0]},
                                                    flagName=${#strings.contains(language, '_') ? splitLang[1] : baseLang},
                                                    flagUrl=${flagName != null ? '/images/flagicons/' + flagName + '.png' : '/images/flagicons/default.png'},
                                                    langTitle=${messages.get(#locale, 'localization.languageCode.' + baseLang, baseLang)}"
                                                >
                                                    <li>
                                                        <a
                                                            class="dropdown-item language-item"
                                                            th:id="${language}"
                                                            th:data-language="${language}"
                                                        >
                                                            <img
                                                                th:src="${flagUrl}"
                                                                height="16"
                                                                class="me-1"
                                                                alt=""
                                                            />
                                                            <span th:text="${langTitle}"></span>
                                                        </a>
                                                    </li>
                                                </th:block>
                                            </th:block>
                                        </ul>
                                    </div>
                                </div>
                            </th>
                        </tr>
                        <tr>
                            <th
                                data-priority="1"
                                th:text="|&nbsp;|"
                            ></th>
                            <th
                                data-priority="7"
                                th:text="${messages.get(#locale, 'question.table.position', 'Position')}"
                            ></th>

                            <th
                                data-priority="3"
                                class="question-header-cell"
                                th:text="${messages.get(#locale, 'question.label.questiontext', 'Question')}"
                            ></th>

                            <th
                                class="text-center"
                                data-priority="2"
                                th:text="${messages.get(#locale, 'question.label.questiontype', 'Question Type')}"
                            ></th>
                            <th
                                class="text-center"
                                data-priority="5"
                                th:text="${messages.get(#locale, 'question.label.enabled', 'Question Enabled')}"
                            ></th>
                            <th
                                class="text-center"
                                data-priority="6"
                                th:text="${messages.get(#locale, 'question.label.required', 'Required')}"
                            ></th>
                            <th
                                class="actionColumn"
                                data-priority="4"
                                th:text="${messages.get(#locale, 'admin.table.actions', 'Actions')}"
                            ></th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr
                            id="emptyRow"
                            style="display: none"
                        >
                            <td
                                class="text-center"
                                colspan="100%"
                            >
                                <th:block
                                    th:text="${messages.get(#locale, 'questionnaire.questions.none', 'There are no questions within this questionnaire')}"
                                />
                            </td>
                        </tr>
                        <th:block th:each="item, questionCounter: ${questionnaire.questions}">
                            <tr
                                th:data-question-type="${item.questionType.name}"
                                th:id="${item.id}"
                                class=""
                            >
                                <td class="align-middle">
                                    <i
                                        class="bi bi-xlarge bi-grip-vertical bi-action"
                                        th:id="|grip-${item.id}|"
                                    ></i>
                                </td>
                                <td
                                    class="align-middle position-cell"
                                    th:data-question-id="${item.id}"
                                >
                                    <!-- Display Mode -->
                                    <span
                                        class="position-display"
                                        th:data-question-id="${item.id}"
                                    >
                                        <th:block th:text="|${item.position}.|" />
                                    </span>

                                    <!-- Edit Mode -->
                                    <div
                                        class="position-edit-group d-none"
                                        th:data-question-id="${item.id}"
                                    >
                                        <input
                                            type="number"
                                            class="form-control form-control-sm position-input"
                                            th:value="${item.position}"
                                            min="1"
                                            max="${questionnaire.questions.size()}"
                                        />
                                        <button
                                            class="btn btn-sm btn-success position-save-btn"
                                            title="Save"
                                        >
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                        <button
                                            class="btn btn-sm btn-secondary position-cancel-btn"
                                            title="Cancel"
                                        >
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    </div>
                                </td>
                                <td
                                    style="width: 300px"
                                    class="question-text-cell align-middle text-start"
                                    th:data-question-id="${item.id}"
                                >
                                    <span class="question-text-content">
                                        <th:block
                                            th:with="
                                                    currentLocale=${#locale.toString()},
                                                    baseLocale=${#strings.listSplit(currentLocale, '_')[0]},
                                                    qMap=${localizedQuestionTextsForQuestion[item.id]},
                                                    countryMap=${qMap != null ? qMap[#locale.country] : null},
                                                    exactText=${countryMap != null ? countryMap['' + currentLocale] : null},
                                                    baseText=${countryMap != null ? countryMap['' + baseLocale] : null}"
                                        >
                                            <th:block
                                                th:if="${exactText != null and !#strings.isEmpty(exactText)}"
                                            >
                                                <th:block th:text="${exactText}"></th:block>
                                            </th:block>
                                            <th:block
                                                th:if="${
                                                        exactText == null and #strings.isEmpty(exactText) and
                                                        baseText != null and !#strings.isEmpty(baseText) 
                                                    }"
                                            >
                                                <th:block th:text="${baseText}"></th:block>
                                            </th:block>
                                            <th:block
                                                th:if="${
                                                        exactText == null and #strings.isEmpty(exactText) and
                                                        baseText == null and #strings.isEmpty(baseText)
                                                    }"
                                            >
                                                <th:block
                                                    th:text="${messages.get(#locale, 'question.label.noTranslation', 'No translation available')}"
                                                ></th:block>
                                            </th:block>
                                        </th:block>
                                    </span>
                                </td>
                                <td class="text-center align-middle">
                                    <th:block
                                        th:text="${messages.get(#locale, '__${item.questionType}__', 'Missing question type')}"
                                    />
                                </td>
                                <td class="text-center align-middle">
                                    <th:block th:if="${item.isEnabled == true}">
                                        <a class="link">
                                            <div class="badge btn-green shadow-sm">
                                                <i class="bi bi-check-circle-fill me-1"></i>
                                                <th:block
                                                    th:text="${messages.get(#locale, 'question.label.status.active', 'Active')}"
                                                ></th:block>
                                            </div>
                                        </a>
                                    </th:block>
                                    <th:block th:unless="${item.isEnabled == true}">
                                        <a class="link">
                                            <div class="badge btn-red shadow-sm">
                                                <i class="bi bi-x-circle-fill me-1"></i>
                                                <th:block
                                                    th:text="${messages.get(#locale, 'question.label.status.inactive', 'Inactive')}"
                                                ></th:block>
                                            </div>
                                        </a>
                                    </th:block>
                                </td>
                                <td class="text-center align-middle">
                                    <th:block th:if="${item.isRequired == true}">
                                        <a class="link">
                                            <div class="badge btn-green shadow-sm">
                                                <i class="bi bi-check-circle-fill me-1"></i>
                                                <th:block
                                                    th:text="${messages.get(#locale, 'question.label.status.required', 'Required')}"
                                                ></th:block>
                                            </div>
                                        </a>
                                    </th:block>
                                    <th:block th:unless="${item.isRequired == true}">
                                        <a class="link">
                                            <div class="badge btn-yellow shadow-sm">
                                                <i class="bi bi-question-circle-fill me-1"></i>
                                                <th:block
                                                    th:text="${messages.get(#locale, 'question.label.status.optional', 'Optional')}"
                                                ></th:block>
                                            </div>
                                        </a>
                                    </th:block>
                                </td>
                                <td class="actionColumn align-middle">
                                    <!--/* Action column for desktop view */-->
                                    <div class="d-none d-xl-block">
                                        <div
                                            class="btn-group"
                                            role="group"
                                        >
                                            <a
                                                class="btn btn-sm btn-primary-list link"
                                                th:href="@{fill?id=__${item.id}__}"
                                            >
                                                <i
                                                    class="bi-pencil-fill bi-list-icon"
                                                    th:title="${messages.get(#locale, 'question.button.edit', 'Edit')}"
                                                ></i>
                                            </a>
                                            <a
                                                class="btn btn-sm btn-primary-list link"
                                                th:href="@{duplicate?id=__${item.id}__&questionnaireId=__${questionnaire.id}__}"
                                            >
                                                <i
                                                    class="bi-copy bi-list-icon"
                                                    th:title="${messages.get(#locale, 'question.button.dublicateAppend', 'Duplicate and Append')}"
                                                ></i>
                                            </a>

                                            <addVar
                                                layout:replace="~{helper/var :: add(
                                            key='questionConditionable',
                                            value=false)}"
                                            >
                                            </addVar>
                                            <th:block
                                                th:if="${item.position eq questionnaire.questions.size()}"
                                            >
                                                <th:block
                                                    th:each="bundleQuestionnaire: ${questionnaire.bundleQuestionnaires}"
                                                >
                                                    <th:block
                                                        th:each="comparedBundleQuestionnaire: ${bundleQuestionnaire.bundle.bundleQuestionnaires}"
                                                    >
                                                        <th:block
                                                            th:if="${comparedBundleQuestionnaire.position > bundleQuestionnaire.position}"
                                                        >
                                                            <addVar
                                                                layout:replace="~{helper/var :: add(
                                                            key='questionConditionable',
                                                            value=true)}"
                                                            >
                                                            </addVar>
                                                        </th:block>
                                                    </th:block>
                                                </th:block>
                                            </th:block>
                                            <th:block>
                                                <a
                                                    class="btn btn-sm btn-primary-list link condition-button"
                                                    th:attr="aria-disabled=${!(item.questionType.name == 'MULTIPLE_CHOICE' or
														item.questionType.name == 'SLIDER' or
														item.questionType.name == 'NUMBER_CHECKBOX' or
														item.questionType.name == 'NUMBER_INPUT' or
														item.questionType.name == 'DROP_DOWN')}"
                                                    th:classappend="${!(item.questionType.name == 'MULTIPLE_CHOICE' or
														item.questionType.name == 'SLIDER' or
														item.questionType.name == 'NUMBER_CHECKBOX' or
														item.questionType.name == 'NUMBER_INPUT' or
														item.questionType.name == 'DROP_DOWN') or
														item.position == questionnaire.questions.size()} ? ' btn-crossed' : ''"
                                                    th:data-question-id="${item.id}"
                                                    th:href="@{/condition/listQuestionConditions?questionId=__${item.id}__}"
                                                >
                                                    <i
                                                        class="bi-signpost-split-fill bi-list-icon"
                                                        th:title="${messages.get(#locale, 'questionnaire.button.editConditions', 'Edit conditions')}"
                                                    ></i>
                                                </a>
                                            </th:block>
                                            <a
                                                class="btn btn-sm btn-primary-list link btn-red"
                                                data-bs-toggle="modal"
                                                th:classappend="${item.isDeletable() ? '' : 'btn-crossed'}"
                                                th:data-bs-target="|#deleteModal_${item.id}|"
                                                th:onclick="|checkQuestionDelete(${item.id}, ${item.hasExportRule()}, ${item.hasConditionsAsTrigger()}, ${item.hasConditionsAsTarget()}, ${item.hasScores()});|"
                                            >
                                                <i
                                                    class="bi-trash-fill bi-list-icon"
                                                    th:title="${messages.get(#locale, 'question.button.remove', 'Remove')}"
                                                ></i>
                                            </a>
                                        </div>
                                    </div>
                                    <!--/* Mobile action menu for smaller resolutions */-->
                                    <div class="d-block d-xl-none">
                                        <a
                                            class="link"
                                            data-bs-toggle="offcanvas"
                                            th:href="|#${item.id}_offcanvas|"
                                            ><i
                                                class="bi bi-three-dots"
                                                style="font-size: 1.5rem"
                                            ></i
                                        ></a>
                                        <!--/* Add the question title for the current locale to the variable scope. Shows Question position + type if not available */-->
                                        <addVar
                                            layout:replace="~{helper/var :: add(
                                                key='currentQuestionForLocale', 
                                                value=${vars['groupedLocalizedTextByCountries']?.get(#locale.country)?.get('__${vars['groupedLocalizedTextByCountries']?.get(#locale.country)?.keySet()?.iterator()?.next()}__')} 
                                                    ?: |${messages.get(#locale, 'condition.option.question', 'Question')}: ${item.position} (${messages.get(#locale, '__${item.questionType}__', '__${item.questionType}__')})|
                                                )}"
                                        >
                                        </addVar>
                                        <th:block
                                            layout:insert="~{fragments/structures :: mobileOptionsMenu(
                                                                itemName=|${vars['currentQuestionForLocale']}|, 
                                                                id=|${item.id}_offcanvas|)}"
                                        >
                                            <th:block layout:fragment="optionsContent">
                                                <a
                                                    class="link"
                                                    th:href="@{fill?id=__${item.id}__}"
                                                    th:text="${messages.get(#locale, 'question.button.edit', 'Edit')}"
                                                >
                                                </a>
                                                <a
                                                    class="link"
                                                    th:href="@{duplicate?id=__${item.id}__&questionnaireId=__${questionnaire.id}__}"
                                                    th:text="${messages.get(#locale, 'question.button.dublicateAppend', 'Duplicate and Append')}"
                                                >
                                                </a>

                                                <addVar
                                                    layout:replace="~{helper/var :: add(
                                                key='questionConditionable', 
                                                value=false)}"
                                                >
                                                </addVar>
                                                <th:block
                                                    th:if="${item.position eq questionnaire.questions.size()}"
                                                >
                                                    <th:block
                                                        th:each="bundleQuestionnaire: ${questionnaire.bundleQuestionnaires}"
                                                    >
                                                        <th:block
                                                            th:each="comparedBundleQuestionnaire: ${bundleQuestionnaire.bundle.bundleQuestionnaires}"
                                                        >
                                                            <th:block
                                                                th:if="${comparedBundleQuestionnaire.position > bundleQuestionnaire.position}"
                                                            >
                                                                <addVar
                                                                    layout:replace="~{helper/var :: add(
                                                                key='questionConditionable', 
                                                                value=true)}"
                                                                >
                                                                </addVar>
                                                            </th:block>
                                                        </th:block>
                                                    </th:block>
                                                </th:block>

                                                <a
                                                    class="link"
                                                    th:href="@{/condition/listQuestionConditions?questionId=__${item.id}__}"
                                                    th:if="${item.questionType.name == 'MULTIPLE_CHOICE' or
                                                    item.questionType.name == 'SLIDER' or
                                                    item.questionType.name  == 'NUMBER_CHECKBOX' or
                                                    item.questionType.name == 'NUMBER_INPUT' or
                                                    item.questionType.name == 'DROP_DOWN'}"
                                                    th:style="${item.position == questionnaire.questions.size() ? 'display: none;' : ''}"
                                                    th:text="${messages.get(#locale, 'questionnaire.button.editConditions', 'Edit conditions')}"
                                                >
                                                </a>

                                                <a
                                                    class="link"
                                                    data-bs-toggle="modal"
                                                    th:classappend="${item.isDeletable() ? '' : 'd-none'}"
                                                    th:data-bs-target="|#deleteModal_${item.id}|"
                                                    th:onclick="|checkQuestionDelete(${item.id}, ${item.hasExportRule()}, ${item.hasConditionsAsTrigger()}, ${item.hasConditionsAsTarget()}, ${item.hasScores()});|"
                                                    th:text="${messages.get(#locale, 'question.button.remove', 'Remove')}"
                                                >
                                                </a>
                                            </th:block>
                                        </th:block>
                                    </div>
                                </td>
                            </tr>
                            <deleteModal
                                layout:replace="~{fragments/deleteModal :: deleteModal(
                                type='question',
                                id=${item.id},
                                name=${item.position},
                                deleteUrl='remove?id=__${item.id}__')}"
                            >
                            </deleteModal>
                        </th:block>
                    </tbody>
                </table>
            </div>
        </div>

        <div
            class="modal fade"
            id="bundleModal"
            tabindex="-1"
            role="dialog"
            aria-labelledby="bundleModalLabel"
            aria-hidden="true"
        >
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5
                            class="modal-title"
                            id="bundleModalLabel"
                        >
                            <th:block
                                th:text="${messages.get(#locale, 'question.button.addToBundle', 'Add to bundle')}"
                            ></th:block>
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-hidden="true"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <div
                            class="accordion"
                            id="bundleAccordion"
                        >
                            <!-- Assigned Bundles (Always Open) -->
                            <div
                                class="accordion-item"
                                th:if="${!#maps.isEmpty(assignedBundles)}"
                            >
                                <h2
                                    class="accordion-header"
                                    id="assignedBundles-heading"
                                >
                                    <button
                                        class="accordion-button collapsed"
                                        type="button"
                                        data-bs-toggle="collapse"
                                        data-bs-target="#assignedBundles-collapse"
                                        aria-expanded="true"
                                        aria-controls="assignedBundles-collapse"
                                        th:text="${messages.get(#locale, 'question.label.assignedBundles', 'Assigned bundles')}"
                                    ></button>
                                </h2>
                                <div
                                    id="assignedBundles-collapse"
                                    class="accordion-collapse collapse"
                                    aria-labelledby="assignedBundles-heading"
                                >
                                    <div class="accordion-body">
                                        <ul
                                            class="list-group mb-0"
                                            id="assignedBundleList"
                                        >
                                            <li
                                                class="list-group-item"
                                                th:each="bundle : ${assignedBundles}"
                                            >
                                                <a
                                                    class="link"
                                                    th:href="@{/bundle/fill(id=${bundle.value})}"
                                                    th:text="${bundle.key}"
                                                >
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                            <!-- Unassigned Bundles (Collapsed by Default) -->
                            <div
                                class="accordion-item"
                                th:if="${!#maps.isEmpty(unassignedBundles)}"
                            >
                                <h2
                                    class="accordion-header"
                                    id="unassignedBundles-heading"
                                >
                                    <button
                                        class="accordion-button"
                                        type="button"
                                        data-bs-toggle="collapse"
                                        data-bs-target="#unassignedBundles-collapse"
                                        aria-expanded="false"
                                        aria-controls="unassignedBundles-collapse"
                                        th:text="${messages.get(#locale, 'question.label.unassignedBundles', 'Unassigned bundles')}"
                                    ></button>
                                </h2>
                                <div
                                    id="unassignedBundles-collapse"
                                    class="accordion-collapse collapse show"
                                    aria-labelledby="unassignedBundles-heading"
                                >
                                    <div class="accordion-body">
                                        <div class="position-relative mb-3">
                                            <span
                                                class="position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"
                                            >
                                                <i class="bi bi-search"></i>
                                            </span>
                                            <input
                                                type="text"
                                                class="form-control ps-5"
                                                id="bundleSearch"
                                                th:placeholder="${messages.get(#locale, 'question.label.search', 'Search...')}"
                                                autocomplete="off"
                                            />
                                        </div>

                                        <div class="my-2">
                                            <form
                                                method="GET"
                                                th:action="@{/bundle/fill}"
                                            >
                                                <button
                                                    type="submit"
                                                    class="btn btn-primary w-100"
                                                    id="addBundle"
                                                    th:text="${messages.get(#locale, 'bundle.button.add', 'Add bundle')}"
                                                >
                                                </button>
                                            </form>
                                        </div>

                                        <ul
                                            class="list-group mb-0"
                                            id="unassignedBundleList"
                                        >
                                            <li
                                                class="list-group-item"
                                                th:each="bundle : ${unassignedBundles}"
                                            >
                                                <a
                                                    class="link"
                                                    th:href="@{/bundle/fill(id=${bundle.value})}"
                                                    th:text="${bundle.key}"
                                                >
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<th:block layout:fragment="scriptContainer">
    <script
        th:inline="javascript"
        type="text/javascript"
    >
        document.addEventListener("DOMContentLoaded", function () {
            const notification = document.getElementById("notification");
            const sortableTable = document.querySelector(".sortable tbody");
            const emptyRow = document.querySelector("tr#emptyRow");
            const questionnaireId = /*[[${questionnaire.id}]]*/ "";
            const languageSelector = document.getElementById("languageSelector");
            const searchInput = document.getElementById("bundleSearch");
            const bundleItems = document.querySelectorAll("#unassignedBundleList .list-group-item");

            // Store initial order for restoration
            let originalOrder = getQuestionIdsFromDom();

            const localizedQuestionTexts = /*[[${localizedQuestionTextsForQuestion}]]*/ {};

            const messages = {
                repositionSuccess:
                    /*[[#{questionnaire.questions.reposition.success}]]*/ "Questions successfully repositioned.",
                repositionError:
                    /*[[#{questionnaire.questions.reposition.error}]]*/ "Error! Questions could not be repositioned.",
                repositonNull:
                    /*[[#{questionnaire.questions.reposition.largerThanNull}]]*/ "Position must be a number greater than 0",
                repositionRange:
                    /*[[#{questionnaire.questions.reposition.positionRange}]]*/ "Position must be between 1 and <SIZE>", //This has to be processed by replacing <SIZE>
            };

            // --- Language Logic ---

            function getQuestionText(questionId, languageCode) {
                if (!localizedQuestionTexts[questionId]) return "";
                const qMap = localizedQuestionTexts[questionId];
                const baseLang = languageCode.includes("_")
                    ? languageCode.split("_")[0]
                    : languageCode;

                for (const country in qMap) {
                    const langs = qMap[country];
                    if (langs[languageCode]) return removeHtmlTags(langs[languageCode]);
                    if (langs[baseLang]) return removeHtmlTags(langs[baseLang]);
                }
                return "";
            }

            function removeHtmlTags(str) {
                if (!str) return "";
                return str.replace(/<[^>]*>?/gm, "");
            }

            function initializeLanguageSelector() {
                const currentLocale = /*[[${#locale.toString()}]]*/ "en_GB";
                if (!checkIfLocaleExists(currentLocale)) {
                    const firstAvailableLocale = Object.values(localizedQuestionTexts)[0];
                    if (firstAvailableLocale) {
                        const firstCountry = Object.keys(firstAvailableLocale)[0];
                        const firstLang = Object.keys(firstAvailableLocale[firstCountry])[0];
                        updateActiveLanguage(firstLang);
                        updateQuestionTexts(firstLang);
                    }
                } else {
                    updateActiveLanguage(currentLocale);
                    updateQuestionTexts(currentLocale);
                }

                document.querySelectorAll(".language-item").forEach((item) => {
                    item.addEventListener("click", function (e) {
                        e.preventDefault();
                        const language = this.getAttribute("data-language");
                        updateActiveLanguage(language);
                        updateQuestionTexts(language);
                    });
                });
            }

            function updateQuestionTexts(language) {
                const rows = sortableTable.querySelectorAll("tr");
                rows.forEach((row) => {
                    const questionId = row.id;
                    const contentSpan = row.querySelector(".question-text-content");
                    if (contentSpan) {
                        const text = getQuestionText(questionId, language);
                        contentSpan.textContent = text || "No translation available";
                    }
                });
            }

            function updateActiveLanguage(language) {
                document
                    .querySelectorAll(".language-item")
                    .forEach((item) => item.classList.remove("active"));
                const activeItem = document.querySelector(
                    `.language-item[data-language="${language}"]`,
                );
                if (activeItem) activeItem.classList.add("active");
            }

            function checkIfLocaleExists(locale) {
                for (const questionId in localizedQuestionTexts) {
                    const qMap = localizedQuestionTexts[questionId];
                    for (const country in qMap) {
                        if (qMap[country][locale]) return true;
                    }
                }
                return false;
            }

            // --- Sortable (Drag & Drop) ---

            new Sortable(sortableTable, {
                items: "tr",
                animation: 150,
                easing: "cubic-bezier(1, 0, 0, 1)",
                handle: ".bi-grip-vertical",
                filter: ".notDraggable",
                onStart: saveOriginalOrder,
                onEnd: handleDragEnd,
            });

            function saveOriginalOrder() {
                originalOrder = getQuestionIdsFromDom();
            }

            function handleDragEnd() {
                const newOrderIds = getQuestionIdsFromDom();
                processReposition(newOrderIds);
            }

            function getQuestionIdsFromDom() {
                return Array.from(sortableTable.querySelectorAll("tr"))
                    .filter((row) => row.id && row.id !== "emptyRow")
                    .map((row) => row.id);
            }

            // --- Position Edit Logic ---

            function initPositionEditing() {
                document.querySelectorAll(".position-cell").forEach((cell) => {
                    const displaySpan = cell.querySelector(".position-display");
                    const editGroup = cell.querySelector(".position-edit-group");
                    const input = cell.querySelector(".position-input");
                    const saveBtn = cell.querySelector(".position-save-btn");
                    const cancelBtn = cell.querySelector(".position-cancel-btn");

                    // Double click to edit
                    displaySpan.addEventListener("dblclick", () => {
                        displaySpan.classList.add("d-none");
                        editGroup.classList.remove("d-none");
                        input.focus();
                        input.select();
                    });

                    // Save
                    saveBtn.addEventListener("click", () => {
                        const targetPos = parseInt(input.value, 10);
                        const questionId = cell.dataset.questionId;

                        if (isNaN(targetPos) || targetPos < 1) {
                            showMessage(messages.repositonNull, true);
                            return;
                        }

                        // Calculate new order based on current DOM state
                        const currentIds = getQuestionIdsFromDom();
                        const totalQuestions = currentIds.length;

                        if (targetPos > totalQuestions) {
                            showMessage(
                                messages.repositionRange.replace("<SIZE>", totalQuestions),
                                true,
                            );
                            return;
                        }

                        // Remove item from current position
                        const currentIndex = currentIds.indexOf(questionId);
                        const [item] = currentIds.splice(currentIndex, 1);

                        // Insert at new position
                        currentIds.splice(targetPos - 1, 0, item);

                        // Deactivate input UI
                        displaySpan.classList.remove("d-none");
                        editGroup.classList.add("d-none");

                        processReposition(currentIds);
                    });

                    // Cancel
                    cancelBtn.addEventListener("click", () => {
                        displaySpan.classList.remove("d-none");
                        editGroup.classList.add("d-none");
                    });

                    // Keyboard
                    input.addEventListener("keydown", (e) => {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            saveBtn.click();
                        } else if (e.key === "Escape") {
                            cancelBtn.click();
                        }
                    });
                });
            }

            // --- Core Repositioning Logic ---

            /**
             * Updates the UI to reflect the new order and sends the request to the backend.
             * @param {string[]} newOrderIds - The new ordered list of question IDs.
             */
            function processReposition(newOrderIds) {
                // 1. Update DOM order to match newOrderIds
                const rows = Array.from(sortableTable.children);
                newOrderIds.forEach((id) => {
                    const row = rows.find((r) => r.id === id);
                    if (row) sortableTable.appendChild(row);
                });

                // 2. Update UI text and buttons
                updateAllPositionDisplays(newOrderIds);
                updateConditionButtons();

                // 3. Send to Backend
                fetch("reposition", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `questionnaireId=${questionnaireId}&questionIds=${newOrderIds.join(",")}`,
                })
                    .then((response) => response.text())
                    .then((data) => {
                        if (data) {
                            // Error occurred
                            showMessage(data, true);
                            restoreOriginalOrder();
                        } else {
                            // Success
                            showMessage(messages.repositionSuccess, false);
                            originalOrder = newOrderIds;
                        }
                    })
                    .catch(() => {
                        showMessage(messages.repositionError, true);
                        restoreOriginalOrder();
                    });
            }

            function updateAllPositionDisplays(orderedIds) {
                orderedIds.forEach((id, index) => {
                    const row = document.getElementById(id);
                    if (row) {
                        const displaySpan = row.querySelector(".position-display");
                        if (displaySpan) {
                            displaySpan.textContent = `${index + 1}.`;
                        }
                        const input = row.querySelector(".position-input");
                        if (input) {
                            input.value = index + 1;
                        }
                    }
                });
            }

            function restoreOriginalOrder() {
                const rows = Array.from(sortableTable.children);
                originalOrder.forEach((id, index) => {
                    const row = rows.find((r) => r.id === id);
                    if (row) {
                        sortableTable.appendChild(row);
                        const displaySpan = row.querySelector(".position-display");
                        if (displaySpan) displaySpan.textContent = `${index + 1}.`;
                    }
                });
                updateConditionButtons();
            }

            function updateConditionButtons() {
                const rows = document.querySelectorAll(".sortable tbody tr:not(#emptyRow)");
                if (rows.length === 0) return;
                const lastQuestionRow = rows[rows.length - 1];

                document.querySelectorAll(".condition-button").forEach((button) => {
                    const questionId = button.getAttribute("data-question-id");
                    const questionRow = document.getElementById(questionId);

                    if (questionRow === lastQuestionRow && isConditionable(questionRow)) {
                        button.classList.add("btn-crossed");
                    } else {
                        if (isConditionable(questionRow)) {
                            button.classList.remove("btn-crossed");
                        }
                    }
                });
            }

            function isConditionable(questionRow) {
                const questionType = questionRow.getAttribute("data-question-type");
                return [
                    "MULTIPLE_CHOICE",
                    "SLIDER",
                    "NUMBER_CHECKBOX",
                    "NUMBER_INPUT",
                    "DROP_DOWN",
                ].includes(questionType);
            }

            // --- UI Helpers ---

            function showMessage(message, isError) {
                if (!notification) return;
                notification.textContent = message;
                notification.classList.remove("alert-success", "alert-danger");
                notification.classList.add(isError ? "alert-danger" : "alert-success");
                notification.style.display = "block";
                $("#notification").stop().fadeOut(0).fadeIn(0).fadeOut(5000);
            }

            function toggleEmptyRow() {
                if (!emptyRow) return;
                emptyRow.style.display = sortableTable.children.length > 1 ? "none" : "table-row";
            }

            // --- Scroll Shadow ---
            const thead = document.querySelector("#questionTable thead");
            let ticking = false;

            function updateShadow() {
                const rect = thead.getBoundingClientRect();
                const isScrolled = rect.top <= 0;
                thead.classList.toggle("scrolled", isScrolled);
                ticking = false;
            }

            function onScroll() {
                if (!ticking) {
                    window.requestAnimationFrame(updateShadow);
                    ticking = true;
                }
            }

            window.addEventListener("scroll", onScroll, { passive: true });

            // --- Init ---
            initializeLanguageSelector();
            initPositionEditing();
            if (notification) notification.style.display = "none";
            toggleEmptyRow();
            updateShadow();

            if (searchInput) {
                searchInput.addEventListener("input", function (e) {
                    const term = e.target.value.toLowerCase();
                    bundleItems.forEach((item) => {
                        const text = item.textContent.toLowerCase();
                        item.style.display = text.includes(term) ? "block" : "none";
                    });
                });
            }
        });
    </script>
    <th:block layout:replace="~{fragments/deleteModal :: deleteModalScript}"></th:block>
</th:block>
