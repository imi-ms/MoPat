<!--/*
    * View to create a new clinic entry or edit an existing one
*/-->

<th:block
  layout:decorate="~{layout/main}"
  th:with="title=${messages.get(#locale, 'clinic.heading.editClinic', 'Edit clinic')}"
>
    <th:block layout:fragment="content">
        <div class="panel-body">
            <form
              th:object="${clinicDTO}"
              enctype="application/x-www-form-urlencoded"
              method="POST"
              th:action="@{edit}"
            >
                <input
                  type="hidden"
                  th:field="*{id}"
                />
                <input
                  hidden="true"
                  th:id="|clinicId|"
                  th:value="${clinicDTO.id}"
                />
                <!--/* The attributes of the clinic */-->
                <div class="form-group">
                    <input
                      layout:replace="~{fragments/forms :: inputWithLabel(
                        for='name', required='true', clazz='form-control', path='name', showErrors=true,
                        text=${messages.get(#locale, 'clinic.label.name', 'Name:')},
                        errorId='validationError')}"
                    />
                </div>
                <div class="form-group">
                    <input
                      layout:replace="~{fragments/forms :: textareaWithLabel(
                        for='description', required='true', path='description', clazz='wysiwyg', showErrors=true,
                        text=${messages.get(#locale, 'clinic.label.description', 'Description:')},
                        errorId='validationError')}"
                    />
                </div>
                <div class="form-group">
                    <input
                      layout:replace="~{fragments/forms :: inputWithLabel(
                        for='email', required=false, path='email', clazz='form-control', showErrors=true,
                        text=${messages.get(#locale, 'clinic.label.email', 'Email:')},
                        errorId='validationError')}"
                    />
                </div>
                <div
                  class="accordion"
                  id="clinicConfigurations"
                >
                    <div class="accordion-item">
                        <h2
                          class="accordion-header"
                          id="headingOne"
                        >
                            <button
                              class="accordion-button"
                              type="button"
                              data-bs-toggle="collapse"
                              data-bs-target="#collapseOne"
                              aria-expanded="false"
                              aria-controls="collapseOne"
                            >
                                <th:block
                                  th:text="${messages.get(#locale, 'clinic.heading.clinicConfiguration', 'Clinic Configuration')}"
                                />
                            </button>
                        </h2>
                        <div
                          id="collapseOne"
                          class="accordion-collapse"
                          aria-labelledby="headingOne"
                          data-bs-parent="#accordionExample"
                        >
                            <ul class="list-group mb-4">
                                <!--/* Loop through all configuration to show them */-->
                                <th:block
                                  layout:replace="~{fragments/processClinicConfigurations :: processClinicConfigurations(
														configurationList=${clinicDTO.clinicConfigurationMappingDTOS},
														selectionPath=|clinicConfigurationMappingDTOS|,
														idPath=|clinicDTO.clinicConfigurationMappingDTOS|,
														parent=null
							)}"
                                />
                            </ul>
                        </div>
                    </div>
                </div>

                <!--/* Assigned bundles: reusable assignment list fragment.
                       componentId must be unique on this page (users get 'clinic-users').
                       Field names (bundleClinicDTOs[i].position / .bundleDTO.id / .bundleDTO.name)
                       match what ClinicController binds, so the controller stays unchanged. */-->
                <div class="mb-4">
                    <div th:replace="~{fragments/assignmentList :: assignmentList(
                        componentId='clinic-bundles',
                        assignedItems=${clinicDTO.bundleClinicDTOs},
                        availableItems=${availableBundleDTOs},
                        fieldPrefix='bundleClinicDTOs',
                        itemDtoField='bundleDTO',
                        itemNameField='name',
                        isSortable=true,
                        isModifiable=true,
                        headingText=${messages.get(#locale, 'clinic.heading.assignedBundles', 'Assigned bundles')},
                        headingInfoText=${messages.get(#locale, 'clinic.heading.availableBundleInfo', 'Only published bundles with at least one questionnaire can be assigned.')},
                        addButtonText=${messages.get(#locale, 'bundle.button.add', 'Add bundles')},
                        emptyStateText=${messages.get(#locale, 'clinic.table.bundlesEmpty', 'No bundles assigned')},
                        reorderText=${messages.get(#locale, 'bundle.button.reorderQuestionnaire', 'Change order')},
                        alreadyAddedText=${messages.get(#locale, 'questionnaire.label.alreadyAdded', 'Already added')},
                        disableWhenEmptySelector=null,
                        itemMetaFragment=null,
                        assignedDetailFragment=null,
                        availableDetailFragment=null
                    )}"></div>
                </div>

                <!--/* Assigned users: uses same fragment as above, but in flat mode.
                       Each list entry is the UserDTO itself, it is not wrapped in an object like UserClinicDTO (-> itemDtoField=null).
                       The user order is not saved (there is no db field), so the list is not sortable. */-->
                <div class="mb-4">
                    <div th:replace="~{fragments/assignmentList :: assignmentList(
                        componentId='clinic-users',
                        assignedItems=${clinicDTO.assignedUserDTOs},
                        availableItems=${availableUserDTOs},
                        fieldPrefix='assignedUserDTOs',
                        itemDtoField=null,
                        itemNameField='username',
                        isSortable=false,
                        isModifiable=true,
                        headingText=${messages.get(#locale, 'clinic.heading.assignedUsers', 'Assigned users')},
                        headingInfoText=null,
                        addButtonText=${messages.get(#locale, 'user.button.add', 'Add users')},
                        emptyStateText=${messages.get(#locale, 'clinic.table.usersEmpty', 'No users assigned')},
                        reorderText=null,
                        alreadyAddedText=${messages.get(#locale, 'questionnaire.label.alreadyAdded', 'Already added')},
                        disableWhenEmptySelector=null,
                        itemMetaFragment=null,
                        assignedDetailFragment=null,
                        availableDetailFragment=null
                    )}"></div>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary"
                  value="save"
                  id="saveButton"
                  name="action"
                  th:text="${messages.get(#locale, 'button.save', 'Save')}"
                >
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  value="cancel"
                  id="cancelButton"
                  name="action"
                  th:text="${messages.get(#locale, 'button.cancel', 'Cancel')}"
                >
                </button>
            </form>
        </div>
    </th:block>
</th:block>

<th:block layout:fragment="scriptContainer">
    <script
      th:inline="javascript"
      type="text/javascript"
    >
        $(document).ready(function () {
            /*[- Initial state check for all checkboxes -]*/

            $("input[triggerid]").each(function () {
                toggleChildrenVisibility(this);
            });
        });


        /*[- used in handleCheckbox -]*/
        function toggleChildrenVisibility(element) {
            if ($(element).is(":checked")) {
                $(element).prev().val("true");
            } else {
                $(element).prev().val("false");
            }

            var configId = $(element).attr("triggerid");

            if (configId != null && configId != undefined && configId != "") {
                $("li[class*=children]")
                  .filter("li[parentid=" + configId + "]")
                  .each(function () {
                      if ($(element).is(":checked")) {
                          $(this).show();
                      } else {
                          $(this).hide();
                      }
                  });
            }
        }
    </script>
    <script th:src="@{/js/helper/assignmentList.js?version=3.5.1}"></script>
</th:block>
